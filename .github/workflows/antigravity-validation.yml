name: Antigravity validation

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/antigravity-429-*'
    paths:
      - 'backend/**'
      - '.github/workflows/antigravity-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Antigravity conversion regression tests
        run: go test -tags=unit -count=1 ./internal/pkg/antigravity
      - name: Antigravity gateway regression tests
        run: go test -tags=unit -count=1 -timeout=15m ./internal/service -run 'Antigravity|SmartRetry|ModelRateLimit'
      - name: Build Linux ARM64 backend
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -o bin/sub2api-linux-arm64 ./cmd/server
      - name: Record artifact checksum
        run: sha256sum bin/sub2api-linux-arm64 > bin/sub2api-linux-arm64.sha256
      - name: Upload diagnostic backend build
        uses: actions/upload-artifact@v6
        with:
          name: sub2api-antigravity-linux-arm64-${{ github.sha }}
          path: |
            backend/bin/sub2api-linux-arm64
            backend/bin/sub2api-linux-arm64.sha256
          retention-days: 7
